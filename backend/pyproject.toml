[project]
name = "bangguseok-manager-backend"
version = "0.1.0"
description = "방구석 매니저 백엔드 (FastAPI)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends/File/Query 기본값 허용

[tool.pytest.ini_options]
testpaths = ["tests"]
